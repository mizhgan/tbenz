services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/gas-station-tracker
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TBANK_API_BASE_URL: ${TBANK_API_BASE_URL:-https://toplivo.tbank.ru/api/v1/stations}
      MIN_POLL_INTERVAL_MINUTES: ${MIN_POLL_INTERVAL_MINUTES:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    # Bound to loopback only, not 0.0.0.0 - this host's system-level nginx
    # (/etc/nginx/sites-available/tbenz.conf, outside this compose file,
    # Certbot-managed) proxies https://tbenz.in/api/ straight to
    # 127.0.0.1:4000, so removing this mapping entirely broke all public API
    # traffic in production (found live: /api/regions came back 502, since
    # nothing was listening on 4000 for that nginx to reach). Loopback-only
    # still keeps the original goal - no external client can reach the raw
    # Express API directly over the internet, only processes on this host
    # (this system nginx, or local debugging) can.
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Loopback-only, not 0.0.0.0 - all public traffic now arrives via the
    # cloudflared service below, which reaches this container over the
    # internal docker network by service name (frontend:80), not through
    # this host port at all. Kept bound to 127.0.0.1 (same pattern as
    # backend's own port mapping) purely for local debugging, not for any
    # production traffic path.
    ports:
      - "127.0.0.1:8080:80"

  # Outbound-only connection to Cloudflare's edge - no host ports needed at
  # all. Reaches the frontend container directly over the default
  # compose-created network by service name (frontend:80), which already
  # proxies /api/ to backend:4000 internally (see frontend/nginx.conf), so
  # one ingress rule in cloudflared/config.yml covers the whole site.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      - frontend

volumes:
  mongo_data:
